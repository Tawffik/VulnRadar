name: VulnRadar Hunt

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes — matches cve.org's own
                              # ~7-minute update cadence closely enough to
                              # avoid missing entries in delta.json's
                              # rolling snapshot (see cve_org.py's docstring)
  workflow_dispatch:
    inputs:
      target_domain:
        description: "Target domain (e.g. example.com) — optional, for a one-off check against this target's tech stack without editing targets/*.yaml"
        required: false
        type: string
      technologies:
        description: "Comma-separated vendor:product pairs for the target above (e.g. nginx:nginx,Apache:HTTP Server). Leave product blank for a vendor-only match: nginx:,Apache:HTTP Server"
        required: false
        type: string
      save_as_permanent_target:
        description: "Also save this as a permanent targets/*.yaml file so future scheduled runs include it automatically"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "targets/**"              # re-run immediately when a target changes...
      - "pipeline/**"             # ...or the hunting engine itself changes...
      - "scripts/**"              # ...or a supporting script changes...
      - ".github/workflows/**"    # ...or the workflow itself changes (validate it works)
      # Deliberately NOT "data/**" or "output/**": those directories are
      # only ever written by this workflow's own automated commit, so
      # triggering on them would create a self-sustaining trigger loop.
      # targets/** IS included even though fingerprinting also writes
      # there - the job-level `if` below breaks that specific loop by
      # skipping any push run whose commit was made by this workflow.

concurrency:
  group: vulnradar-hunt
  cancel-in-progress: false   # never overlap runs: they all commit the same state file

permissions:
  contents: write   # needed to commit the updated state + hunter_queue.md back

jobs:
  hunt:
    # Skip a push-triggered run whose commit was made by this workflow's
    # own automated commit step (see the "Commit updated state..." step) -
    # otherwise a fingerprint refresh that updates targets/*.yaml (an
    # expected part of every run) would itself trigger a brand-new push
    # run, which commits again, which triggers again... The one-line
    # guard below breaks that loop while still allowing a genuine human
    # push to targets/**, pipeline/**, scripts/**, or the workflow itself
    # to trigger normally.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: sengi-standard-2-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fast-forward to latest main (in case this run sat queued behind others)
        # cancel-in-progress: false means multiple triggers can queue up;
        # a run that waited behind others should still operate on the
        # latest committed state/targets, not whatever SHA it was
        # originally queued against.
        run: git pull --ff-only origin main || echo "⚠️ could not fast-forward, continuing with checked-out commit"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pyyaml packaging

      - name: Install httpx, nuclei, subfinder (all optional — hunt continues without any of them)
        run: |
          # Each installer uses `set -euo pipefail` internally, so a failure
          # inside one WOULD normally abort this whole step (GitHub Actions
          # runs `run:` blocks with `bash -e`) and take the entire job down
          # with it, even though none of these three tools are required for
          # the core CVE intelligence pipeline to run. The `||` here is the
          # fix: an install failure is downgraded to a warning, and the
          # corresponding stage (fingerprinting / nuclei verification /
          # subdomain discovery) reports itself UNAVAILABLE later instead.
          bash scripts/install_httpx.sh      || echo "⚠️ httpx install failed — fingerprinting unavailable this run, existing target technologies will be used"
          bash scripts/install_nuclei.sh     || echo "⚠️ nuclei install failed — live verification unavailable this run"
          bash scripts/install_subfinder.sh  || echo "⚠️ subfinder install failed — passive subdomain discovery unavailable this run"
          nuclei -update-templates -silent 2>/dev/null || echo "⚠️ nuclei template update failed (or nuclei itself is unavailable), continuing with whatever is cached"

      - name: Refresh target fingerprints (httpx tech-detect)
        # Always runs: httpx against a handful of targets is fast (a few
        # seconds each) and idempotent, so there's no real cost to doing
        # it every 15 minutes too — simpler and more correct than trying
        # to throttle by run number (GitHub Actions expressions have no
        # modulo operator).
        run: python3 scripts/refresh_target_fingerprints.py || echo "⚠️ fingerprint refresh failed, continuing with existing targets/*.yaml"

      - name: Save ad-hoc target as a permanent file (if requested)
        if: github.event.inputs.save_as_permanent_target == 'true' && github.event.inputs.target_domain != ''
        env:
          TARGET_DOMAIN: ${{ github.event.inputs.target_domain }}
          TARGET_TECH: ${{ github.event.inputs.technologies }}
        run: |
          python3 scripts/save_target.py --target "$TARGET_DOMAIN" --technologies "$TARGET_TECH"

      - name: Run VulnRadar
        id: hunt
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # optional — set this repo secret to raise NVD's
                                                      # rate limit from 5 req/30s to 50 req/30s.
                                                      # Works fine without it too.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # built-in, always available — raises
                                                      # GitHub Advisories' rate limit from 60/hr
                                                      # to 5000/hr, no setup needed.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # optional — Discord alerts for relevant CVEs
          ADHOC_TARGET: ${{ github.event.inputs.target_domain }}
          ADHOC_TECH: ${{ github.event.inputs.technologies }}
          SAVE_PERMANENT: ${{ github.event.inputs.save_as_permanent_target }}
        run: |
          set +e
          ARGS=()
          if [ -n "$ADHOC_TARGET" ] && [ "$SAVE_PERMANENT" != "true" ]; then
            # Only pass --adhoc-target when NOT saved permanently - a saved
            # target already lives in targets/ and is loaded normally.
            ARGS=(--adhoc-target "$ADHOC_TARGET" --adhoc-tech "$ADHOC_TECH")
          fi
          bash scripts/run_hunt.sh "${ARGS[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit-code semantics (see pipeline/intelligence/run_status.py):
          #   0  = SUCCESS  - every source/stage completed cleanly
          #   10 = DEGRADED - some source(s) failed but usable intelligence
          #        was still produced/preserved; this is a NORMAL, expected
          #        outcome (a source being temporarily down is routine), not
          #        a job failure - state/report ARE committed for this case.
          #   20 = FAILED   - no usable intelligence at all this run; state
          #        is intentionally left untouched by run_hunt.py itself,
          #        so nothing is committed for this case either.
          if [ "$code" = "0" ]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "10" ]; then
            echo "status=DEGRADED" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated state and hunter queue
        # Commit on SUCCESS or DEGRADED - a degraded run still produced (or
        # correctly preserved) usable intelligence and its own state
        # bookkeeping is authoritative (see state_store.py); only a truly
        # FAILED run (exit 20, nothing usable) skips committing, since
        # run_hunt.py itself already left state untouched in that case.
        if: steps.hunt.outputs.status == 'SUCCESS' || steps.hunt.outputs.status == 'DEGRADED'
        run: |
          git config user.name "vulnradar-bot"
          git config user.email "vulnradar-bot@users.noreply.github.com"
          git add data/state/ output/ targets/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update KEV state and hunter queue [automated]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest main..."
            # These files are always fully regenerated by this same run, so on a
            # rebase conflict our version is authoritative for them specifically -
            # concurrency: group already prevents two runs executing in parallel,
            # this only covers a push/dispatch race on the SAME commit.
            git pull --rebase --autostash -X ours origin main \
              || { git rebase --abort 2>/dev/null; sleep $((attempt * 5)); continue; }
          done
          echo "❌ could not push after 5 attempts"
          exit 1

      - name: Upload run artifacts (hunter queue, diagnostics, run summary)
        # always(): a degraded or even failed run can still have produced
        # a partial report, diagnostics, or a run summary worth looking
        # at - losing that evidence just because the run wasn't a clean
        # SUCCESS would defeat the point of tracking degraded state at all.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnradar-run-${{ github.run_number }}
          path: |
            output/hunter_queue.md
            output/diagnostics.md
            output/run_summary.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail the job only on a genuinely unusable run
        # Exit code 20 (FAILED) is the only case that should show red in
        # the Actions UI - 10 (DEGRADED) is an expected, non-alarming
        # outcome (see the exit-code comment above) and must not be
        # reported as a job failure, or "one source had a bad day" would
        # generate noisy false-alarm failure notifications every time.
        if: steps.hunt.outputs.status == 'FAILED'
        run: exit 1
